name: crm-lead

# 本地开发用：通过宿主机 SOCKS5 转发 CRM HTTP 请求，不修改业务代码或宿主机代理规则。
x-local-crm-proxy-environment: &local_crm_proxy_environment
  CRM_HTTP_TRUST_ENV: "false"
  CRM_HTTP_PROXY: "http://crm-proxy:8080"

services:
  crm-proxy:
    build:
      context: ./docker/crm-proxy
    environment:
      LISTEN_HOST: 0.0.0.0
      LISTEN_PORT: "8080"
      SOCKS_HOST: ${CRM_PROXY_SOCKS_HOST:-host.docker.internal}
      SOCKS_PORT: ${CRM_PROXY_SOCKS_PORT:-7897}
      TARGET_HOST: ${CRM_PROXY_TARGET_HOST:-sopapi-test.cgxi.net}
      TARGET_CONNECT_HOST: ${CRM_PROXY_TARGET_CONNECT_HOST:-192.168.3.108}
      TARGET_PORT: ${CRM_PROXY_TARGET_PORT:-80}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import os,socket;
          s=socket.create_connection(("127.0.0.1",int(os.environ.get("LISTEN_PORT","8080"))),1);
          s.close()
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  app:
    environment:
      <<: *local_crm_proxy_environment
    depends_on:
      crm-proxy:
        condition: service_healthy

  worker:
    environment:
      <<: *local_crm_proxy_environment
    depends_on:
      crm-proxy:
        condition: service_healthy

  scheduler:
    environment:
      <<: *local_crm_proxy_environment
    depends_on:
      crm-proxy:
        condition: service_healthy

  wecom-bot:
    environment:
      <<: *local_crm_proxy_environment
    depends_on:
      crm-proxy:
        condition: service_healthy
