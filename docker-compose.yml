name: crm-lead

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_lead}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local_only}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      TZ: Asia/Shanghai
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    environment: &application_environment
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_local_only}@postgres:5432/${POSTGRES_DB:-crm_lead}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ADMIN_IDENTITY_PROVIDER: ${ADMIN_IDENTITY_PROVIDER:-development}
      SMART_TABLE_ADAPTER: ${SMART_TABLE_ADAPTER:-mock}
      CRM_ADAPTER: ${CRM_ADAPTER:-unconfigured}
      WECOM_CARD_CALLBACK_ENABLED: ${WECOM_CARD_CALLBACK_ENABLED:-false}
      WECOM_CARD_TRANSPORT_CONFIGURED: ${WECOM_CARD_TRANSPORT_CONFIGURED:-false}
      WECOM_CARD_CALLBACK_HANDLER_CONFIGURED: ${WECOM_CARD_CALLBACK_HANDLER_CONFIGURED:-false}
      WECOM_CARD_CALLBACK_TIMEOUT_SECONDS: ${WECOM_CARD_CALLBACK_TIMEOUT_SECONDS:-4}
      WECOM_SMART_TABLE_DOC_ID: ${WECOM_SMART_TABLE_DOC_ID:-}
      WECOM_SMART_TABLE_SHEET_ID: ${WECOM_SMART_TABLE_SHEET_ID:-}
      WECOM_SMART_TABLE_SALES_CAN_CREATE_RECORDS: ${WECOM_SMART_TABLE_SALES_CAN_CREATE_RECORDS:-}
      WECOM_SMART_TABLE_SALES_CAN_DELETE_RECORDS: ${WECOM_SMART_TABLE_SALES_CAN_DELETE_RECORDS:-}
      WECOM_CLI_COMMAND: ${WECOM_CLI_COMMAND:-wecom-cli}
      WECOM_CLI_TIMEOUT_SECONDS: ${WECOM_CLI_TIMEOUT_SECONDS:-20}
      WECOM_CLI_RETRY_COUNT: ${WECOM_CLI_RETRY_COUNT:-1}
      LEAD_CONTEXT_TTL_MINUTES: ${LEAD_CONTEXT_TTL_MINUTES:-30}
      LEAD_MESSAGE_RETRY_COUNT: ${LEAD_MESSAGE_RETRY_COUNT:-1}
      LEAD_OUTBOX_POLL_SECONDS: ${LEAD_OUTBOX_POLL_SECONDS:-10}
      LEAD_PROCESSING_TIMEOUT_SECONDS: ${LEAD_PROCESSING_TIMEOUT_SECONDS:-300}
      LLM_PROVIDER: ${LLM_PROVIDER:-qwen}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3.7-flash}
      CONSOLE_DEV_ADMIN_TOKEN: ${CONSOLE_DEV_ADMIN_TOKEN:-}
      CONSOLE_DEV_ADMIN_SUBJECT: ${CONSOLE_DEV_ADMIN_SUBJECT:-development-admin}
      CONSOLE_DEV_ADMIN_ROLE: ${CONSOLE_DEV_ADMIN_ROLE:-administrator}
      WORKER_READINESS_CONFIGURED: ${WORKER_READINESS_CONFIGURED:-false}
      SCHEDULER_READINESS_CONFIGURED: ${SCHEDULER_READINESS_CONFIGURED:-false}
      AI_GATEWAY_TIMEOUT_SECONDS: ${AI_GATEWAY_TIMEOUT_SECONDS:-60}
      AI_GATEWAY_RETRY_COUNT: ${AI_GATEWAY_RETRY_COUNT:-1}
      AI_HIGH_CONFIDENCE_THRESHOLD: ${AI_HIGH_CONFIDENCE_THRESHOLD:-0.85}
      AI_MEDIUM_CONFIDENCE_THRESHOLD: ${AI_MEDIUM_CONFIDENCE_THRESHOLD:-0.60}
      MEDIA_STORAGE_PATH: ${MEDIA_STORAGE_PATH:-/var/lib/crm-lead/media}
      MEDIA_STORAGE_PROVIDER: ${MEDIA_STORAGE_PROVIDER:-local}
      MEDIA_STORAGE_ENDPOINT: ${MEDIA_STORAGE_ENDPOINT:-}
      MEDIA_STORAGE_BUCKET: ${MEDIA_STORAGE_BUCKET:-}
      MEDIA_STORAGE_ACCESS_KEY: ${MEDIA_STORAGE_ACCESS_KEY:-}
      MEDIA_STORAGE_SECRET_KEY: ${MEDIA_STORAGE_SECRET_KEY:-}
      MEDIA_STORAGE_INGEST_ACCESS_KEY: ${MEDIA_STORAGE_INGEST_ACCESS_KEY:-}
      MEDIA_STORAGE_INGEST_SECRET_KEY: ${MEDIA_STORAGE_INGEST_SECRET_KEY:-}
      MEDIA_STORAGE_CLEANUP_ACCESS_KEY: ${MEDIA_STORAGE_CLEANUP_ACCESS_KEY:-}
      MEDIA_STORAGE_CLEANUP_SECRET_KEY: ${MEDIA_STORAGE_CLEANUP_SECRET_KEY:-}
      MEDIA_STORAGE_SIGNER_ACCESS_KEY: ${MEDIA_STORAGE_SIGNER_ACCESS_KEY:-}
      MEDIA_STORAGE_SIGNER_SECRET_KEY: ${MEDIA_STORAGE_SIGNER_SECRET_KEY:-}
      MEDIA_STORAGE_PRIVATE: ${MEDIA_STORAGE_PRIVATE:-false}
      MEDIA_STORAGE_TLS: ${MEDIA_STORAGE_TLS:-false}
      MEDIA_STORAGE_ENCRYPTION: ${MEDIA_STORAGE_ENCRYPTION:-false}
      MEDIA_STORAGE_SIGNED_URL: ${MEDIA_STORAGE_SIGNED_URL:-false}
      MEDIA_STORAGE_HEAD: ${MEDIA_STORAGE_HEAD:-false}
      MEDIA_STORAGE_DELETE: ${MEDIA_STORAGE_DELETE:-false}
      MEDIA_SIGNED_URL_TTL_SECONDS: ${MEDIA_SIGNED_URL_TTL_SECONDS:-}
      MEDIA_SIGNED_URL_MAX_TTL_SECONDS: ${MEDIA_SIGNED_URL_MAX_TTL_SECONDS:-900}
      MEDIA_SCANNER_PROVIDER: ${MEDIA_SCANNER_PROVIDER:-noop}
      MEDIA_RETENTION_POLICY_VERSION: ${MEDIA_RETENTION_POLICY_VERSION:-}
      MEDIA_RETENTION_DAYS: ${MEDIA_RETENTION_DAYS:-}
      MESSAGE_PAYLOAD_RETENTION_DAYS: ${MESSAGE_PAYLOAD_RETENTION_DAYS:-}
      NOTIFICATION_PAYLOAD_RETENTION_DAYS: ${NOTIFICATION_PAYLOAD_RETENTION_DAYS:-}
      RETENTION_CLEANUP_BATCH_SIZE: ${RETENTION_CLEANUP_BATCH_SIZE:-100}
      RETENTION_CLEANUP_LEASE_SECONDS: ${RETENTION_CLEANUP_LEASE_SECONDS:-300}
      TZ: Asia/Shanghai
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    environment: *application_environment
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # 真实 Adapter 只读挂载本机 CLI 凭据；镜像、代码仓库和容器环境变量均不保存密钥。
    volumes: &application_volumes
      - type: bind
        source: ${WECOM_CLI_CREDENTIALS_PATH:-./.wecom-cli-credentials}
        target: /home/appuser/.config/wecom
        read_only: true
      - media_data:/var/lib/crm-lead/media
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "app"]
      interval: 10s
      # readiness 会读取真实 CLI schema；给单次外部调用保留足够的容器探针时间。
      timeout: 7s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    environment: *application_environment
    command: ["celery", "-A", "workers.celery_app:celery_app", "worker", "--loglevel=INFO", "--hostname=worker@%h"]
    # Worker 与应用共用同一只读凭据挂载，确保后台同步走真实 CLI 时也可授权。
    volumes: *application_volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "broker"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  scheduler:
    build: .
    environment: *application_environment
    command: ["celery", "-A", "workers.celery_app:celery_app", "beat", "--loglevel=INFO"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "broker"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  wecom-bot:
    build: .
    environment:
      <<: *application_environment
      WECOM_BOT_ID: "${WECOM_BOT_ID:-}"
      WECOM_BOT_SECRET: "${WECOM_BOT_SECRET:-}"
      WECOM_CARD_CALLBACK_ENABLED: "${WECOM_CARD_CALLBACK_ENABLED:-false}"
    command: ["python", "-m", "app.wecom_bot.runner"]
    volumes: *application_volumes
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/wecom-bot-ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
